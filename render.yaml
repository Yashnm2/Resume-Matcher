services:
  - type: web
    name: resume-matcher-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: FRONTEND_BASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: HF_STATE_REPO_ID
        sync: false
      - key: HF_TOKEN
        sync: false
