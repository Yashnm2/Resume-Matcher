services:
  - type: web
    name: resume-matcher
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: HF_STATE_REPO_ID
        sync: false
      - key: HF_TOKEN
        sync: false
